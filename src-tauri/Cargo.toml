[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# 常駐時の再表示・明示終了導線として、Tauri本体のトレイ機能だけを有効化する。
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
thiserror = "1.0"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "blocking", "json"] }
rss = "2"
scraper = "0.24"
serde_yaml = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
atom_syndication = "0.12"
# 月次アーカイブのZIP圧縮（データ設計書 §14）。std/既存に ZIP 作成機能が無いため追加。
# C依存を避けるため default-features は無効化し、純Rustの deflate のみ有効化（常駐負荷・ビルド軽量化）。
zip = { version = "2", default-features = false, features = ["deflate"] }

# 全画面アプリ・プレゼン中のゆうこ通知抑制（ゆうこ登場・通知挙動 詳細設計書 §5.2、2026-10-05 承認）。
# SHQueryUserNotificationState を呼ぶためだけに Windows 限定で使う。tauri 経由で同じ 0.61 が
# 既に依存ツリーにあり、追加の取得・ビルドはほぼ増えない。std には該当 API が無い。
# MIT / Apache-2.0。常駐負荷は判定時の API 呼び出し 1 回のみ（常駐スレッド・フックなし）。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell"] }
