# メインウィンドウ（capabilities/default.json）へ付与する、アプリ定義 command の権限セット。
# タスク vA1wHU / 判断台帳 D110: command をウィンドウごとの許可制にし、メインには全 command を一括で許可する。
#
# 各 `allow-<command-kebab>` は build.rs が command_manifest.rs の一覧から自動生成する
# （permissions/autogenerated/ 配下。生成物のため git 管理外）。
# command を追加したら、ここへも `allow-<command-kebab>` を足す。足し忘れるとメイン画面からの呼び出しが
# 実行時に拒否される（`cargo test` の command_permissions テストでも検出する）。

[[set]]
identifier = "main-window-commands"
description = "メインウィンドウ用。アプリ定義の Tauri command をすべて許可する。"
permissions = [
  "allow-get-recommended-articles",
  "allow-list-article-history",
  "allow-get-article-detail",
  "allow-update-article-favorite",
  "allow-open-original-article",
  "allow-generate-article-summary",
  "allow-get-archive-candidates",
  "allow-archive-old-articles",
  "allow-restore-archived-article",
  "allow-retire-archived-markdown",
  "allow-list-archive-months",
  "allow-list-archive-month-articles",
  "allow-get-archive-month-delete-preview",
  "allow-delete-archive-month",
  "allow-get-autostart-enabled",
  "allow-set-autostart-enabled",
  "allow-restart-app",
  "allow-quit-resident-app",
  "allow-set-main-window-unsaved-changes",
  "allow-take-pending-main-window-article",
  "allow-export-migration-data",
  "allow-open-migration-folder",
  "allow-get-storage-usage",
  "allow-list-migration-imports",
  "allow-import-migration-data",
  "allow-refresh-news",
  "allow-explain-selected-term",
  "allow-list-dictionary-entries",
  "allow-save-dictionary-entry",
  "allow-update-dictionary-memo",
  "allow-update-dictionary-favorite",
  "allow-delete-dictionary-entry",
  "allow-ping",
  "allow-get-user-settings",
  "allow-get-ui-theme-id",
  "allow-save-user-settings",
  "allow-set-nickname",
  "allow-reset-user-settings",
  "allow-test-ai-provider",
  "allow-get-yuuko-notification-state",
  "allow-confirm-rank-up-reward",
  "allow-dismiss-yuuko-notification",
  "allow-handle-yuuko-clicked",
  "allow-request-yuuko-notification",
  "allow-mark-yuuko-ignored",
  "allow-get-friendship-state",
  "allow-record-friendship-event",
  "allow-get-reward-state",
  "allow-set-active-theme",
  "allow-get-gacha-state",
  "allow-draw-gacha-once",
  "allow-mark-gacha-items-seen",
  "allow-get-pattern-state",
  "allow-set-active-pattern",
  "allow-get-dressup-state",
  "allow-set-active-balloon",
  "allow-set-active-deco",
]
