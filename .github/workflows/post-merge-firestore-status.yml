# PRマージ後 Firestoreタスク状態「判定のみ（report-only）」ワークフロー（フェーズ0）。
#
# 流れ:
#   PR が develop にマージされる → PR情報＋Firestore現状（読み取り専用）から
#   対象タスク候補を特定し、Done / Review / no_change を判定 → JSON artifact と Step Summary に出す。
#
# 安全方針（重要・フェーズ0）:
# - Firestore への書き込みは一切しない（読み取り専用）。enable_apply 等の実行トグルもまだ持たない。
# - PRコメント投稿・Markdown更新はしない。出力は artifact と Step Summary のみ。
# - 同期用ブランチ（sync/*）や bot（github-actions[bot]）の PR は早期スキップ（フィードバックループ防止）。
# - 権限は最小（contents: read / pull-requests: read）。
#
# 必要な GitHub Secret:
#   FIREBASE_SERVICE_ACCOUNT_JSON … Firestore 読み取り権限を持つサービスアカウントの JSON 全文。

name: Post-merge Firestore Status (report-only)

on:
  pull_request:
    types: [closed]
    branches: [develop]
  # マージ後の自動更新が no_change 等で失敗したPRを、PR番号だけ指定して安全に再実行する。
  # 入力は pr_number のみ（任意の taskId / branchName / taskCode / 更新先status は受け取らない）。
  # 判定・apply・安全ガードは既存の post-merge-firestore-status.mjs を再利用する（新規書き込みロジックは作らない）。
  workflow_dispatch:
    inputs:
      pr_number:
        description: 再処理するマージ済みPR番号
        required: true
        type: number

# 既定は最小権限（read）。write が要る後続の sync-md ジョブだけ job 単位で write を付ける。
# top-level を read に保つことで、将来 job を追加しても不要な write が広がらないようにする。
# apply 成功時に呼ぶ再利用ワークフロー（sync）は commit/PR 作成のため write が必要だが、
# その付与は sync-md ジョブの job 単位 permissions に限定する。
permissions:
  contents: read
  pull-requests: read

env:
  PR_CONTEXT: task-management/tmp/post-merge-pr-context.json
  REPORT_OUT: task-management/tmp/post-merge-status-report.json

jobs:
  report:
    # マージされたPRのみ対象（クローズのみは除外）。手動再実行（workflow_dispatch）は常にジョブを起動し、
    # マージ有無・base・sync/bot 等の安全条件は既存 mjs 側で判定する（未マージ等は no_change に倒れる）。
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    # report ジョブは従来どおり最小権限（読み取りのみ）に制限する。Firestore 書き込みは
    # サービスアカウント経由で GITHUB_TOKEN は使わないため、write は不要。
    permissions:
      contents: read
      pull-requests: read
    # apply が実際に成功したか（apply.applied === true）を後続ジョブへ渡す。
    outputs:
      applied: ${{ steps.applied.outputs.applied }}
    steps:
      # 1. 早期スキップ判定: sync/* ブランチ or bot PR は以降を全てスキップする。
      - name: Early skip (sync/* or bot PR)
        id: guard
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [[ "$HEAD_REF" == sync/* || "$AUTHOR" == "github-actions[bot]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            {
              echo "## PRマージ後 Firestore状態 判定（report-only）"
              echo ""
              echo "- 早期スキップ: head=\`$HEAD_REF\` author=\`$AUTHOR\`（sync/* または bot PR）"
              echo ""
              echo "> フェーズ0のため Firestore は変更していません。"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 2. checkout（スクリプトと読み取りモジュールを使うため）。
      - name: Checkout
        if: steps.guard.outputs.skip == 'false'
        uses: actions/checkout@v4

      # 3. Node セットアップ（スクリプトは Node 標準 API のみ使用）。
      - name: Setup Node
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 4. Firestore 認証: Secret の JSON を $RUNNER_TEMP へ書き出し、認証パスを設定する（読み取り専用用途）。
      - name: Write service account credentials
        if: steps.guard.outputs.skip == 'false'
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_JSON が未設定です。" >&2
            exit 1
          fi
          CRED_PATH="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$CRED_PATH"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED_PATH" >> "$GITHUB_ENV"

      # 5. PR情報の組み立て: pull_request(closed) / workflow_dispatch の両方で共通に、GitHub API から
      #    最新のPR情報を取得して PR コンテキスト JSON を作る（本文修正後の手動再実行で最新本文を使うため、
      #    github.event.pull_request.body へ完全依存しない）。変換は build-pr-context.mjs に集約（テスト可能）。
      - name: Build PR context JSON
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          # workflow_dispatch は入力の pr_number、pull_request はイベントのPR番号を使う（同一リポジトリのPR）。
          PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.pull_request.number }}
        run: |
          mkdir -p task-management/tmp
          # gh pr view --json files は先頭100件までに制限される可能性があるため、changedFiles（実件数）も
          # 取得し、取得件数との差でファイル一覧の不完全さを検知する（既存仕様を維持）。
          gh pr view "$PR_NUMBER" \
            --json number,headRefName,baseRefName,state,mergedAt,author,body,files,changedFiles \
            > task-management/tmp/pr-view.json
          node task-management/build-pr-context.mjs \
            --gh-json task-management/tmp/pr-view.json \
            --out "$PR_CONTEXT"

      # 6. 判定 → JSON と Step Summary へ出力。スクリプトは GITHUB_STEP_SUMMARY へ直接追記する。
      #    Firestore 更新（--apply）は Repository Variable POST_MERGE_ENABLE_APPLY == 'true' のときだけ付ける。
      #    未設定 / false / その他の値は --apply を付けない（＝既定 report-only、書き込みなし）。
      #    Firestore 書き込みはサービスアカウント経由のため GITHUB_TOKEN 権限は増やさない。
      - name: Run judgment (apply gated by POST_MERGE_ENABLE_APPLY)
        if: steps.guard.outputs.skip == 'false'
        env:
          ENABLE_APPLY: ${{ vars.POST_MERGE_ENABLE_APPLY }}
        run: |
          if [ "$ENABLE_APPLY" = "true" ]; then
            APPLY_FLAG="--apply"
            GATE="ENABLED（POST_MERGE_ENABLE_APPLY=true）: Firestore を更新します"
          else
            APPLY_FLAG=""
            GATE="DISABLED（report-only, POST_MERGE_ENABLE_APPLY='${ENABLE_APPLY:-未設定}'）: Firestore は変更しません"
          fi
          echo "apply gate: $GATE"
          {
            echo "### apply gate"
            echo "- $GATE"
          } >> "$GITHUB_STEP_SUMMARY"
          # APPLY_FLAG は未設定時に空文字（トークンなし）になるよう意図的にクォートしない。
          node task-management/post-merge-firestore-status.mjs \
            --pr-json "$PR_CONTEXT" \
            --out "$REPORT_OUT" \
            $APPLY_FLAG

      # 6.5 post-merge status apply 成功判定: レポート JSON の apply.applied === true のときだけ、
      #     後続の Firestore → Markdown 同期を走らせる。apply.applied は done_candidate→Done /
      #     review_candidate→Review のどちらの更新成功でも true になる（どちらも Firestore の
      #     status が変わり md 同期対象になるため）。report-only / no_change / 未チェック /
      #     status非Doing / apply失敗 では applied=false になり同期しない。
      #     always(): apply 成功後に issuePr 書き戻しなど後続処理が失敗して前段 step が
      #     非ゼロ終了しても、Firestore が更新済みなら md 同期条件を評価できるようにする。
      #     （早期スキップ時は skip=='false' で false になり、この step 自体は動かない。）
      - name: Detect apply success
        id: applied
        if: always() && steps.guard.outputs.skip == 'false'
        run: |
          APPLIED=false
          if [ -f "$REPORT_OUT" ]; then
            APPLIED="$(node -e "try{const r=require('./'+process.env.REPORT_OUT);process.stdout.write(String(r.apply&&r.apply.applied===true))}catch(e){process.stdout.write('false')}")"
          fi
          echo "apply.applied=$APPLIED"
          echo "applied=$APPLIED" >> "$GITHUB_OUTPUT"

      # 7. 判定レポートを artifact として保存する（人手確認用）。
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-merge-status-report
          path: ${{ env.REPORT_OUT }}
          if-no-files-found: ignore

  # post-merge の status apply（done_candidate→Done / review_candidate→Review）が実際に成功
  # （apply.applied === true）したときだけ、既存の Firestore → Markdown 同期ワークフローを再利用して呼ぶ
  # （同期ロジックは新規作成しない）。
  # 以下では起動しない: report-only / no_change / 未チェック / status非Doing / apply失敗 /
  # sync/* ブランチ / bot PR（いずれも applied != 'true' になる）。
  # always(): apply は成功したが issuePr 書き戻し等で report job が failure になった場合でも、
  # Firestore は更新済みなので md 同期PRは作られるべき。applied=='true' ゲートで安全側は維持する。
  sync-md:
    needs: report
    if: always() && needs.report.outputs.applied == 'true'
    # 再利用ワークフロー（sync）は commit/PR 作成のため write が必要。この job にだけ付与する。
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/sync-firestore-to-markdown.yml
    with:
      # Done apply 成功後の同期は safe なら自動マージ寄りにする（safeAutoMerge / merge_ok /
      # 変更1ファイル の既存安全ゲートは維持。CI 必須チェック通過後に --auto でマージ）。
      enable_auto_merge: true
    # Firestore 読み取り用のサービスアカウントと、同期PRのCIを起動できる専用トークンを明示的に受け渡す
    # （inherit はしない＝最小受け渡し）。SYNC_PR_TOKEN は sync 側で必須（未設定なら失敗する）。
    secrets:
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      SYNC_PR_TOKEN: ${{ secrets.SYNC_PR_TOKEN }}
